name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: 后端构建 + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 单元测试零外部依赖（无 DB/Nacos/Docker/LLM），verify 即跑全部 *Test
      - name: Build & test
        run: mvn -B -ntp clean verify

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
