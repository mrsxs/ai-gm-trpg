server:
  port: 8083
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/aigm_game?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "${MYSQL_PASSWORD:root}"
    driver-class-name: com.mysql.cj.jdbc.Driver
springdoc:
  swagger-ui:
    path: /doc/game.html
  api-docs:
    path: /v3/api-docs
# Feign 超时（基线 §3.4）：AI 相关 readTimeout 60s，其余默认 5s
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
      ai-engine-service:
        connectTimeout: 3000
        readTimeout: 60000
