server:
  port: 8082
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/aigm_scenario?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "${MYSQL_PASSWORD:root}"
    driver-class-name: com.mysql.cj.jdbc.Driver
springdoc:
  swagger-ui:
    path: /doc/scenario.html
  api-docs:
    path: /v3/api-docs
