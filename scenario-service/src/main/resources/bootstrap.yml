spring:
  application:
    name: scenario-service
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      discovery:
        namespace: public
        group: DEFAULT_GROUP
      config:
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
        shared-configs:
          - data-id: aigm-common.yaml
            group: DEFAULT_GROUP
            refresh: true
